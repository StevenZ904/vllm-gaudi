model_card:
  model_name: "Qwen/Qwen3.8-Flash-Next-FP8"
  tasks: "gsm8k_custom_stop"
  num_fewshot: 5
  trust_remote_code: true
  limit: 256
  max_num_seqs: 128
  max_model_len: 8192
  batch_size: 128
  dtype: bfloat16
  enable_expert_parallel: true
  gpu_memory_utilization: 0.8
  max_num_batched_tokens: 8192
  max_gen_toks: 2048
  # Chat-tuned model: on raw-text few-shot prompts it ends the turn immediately, so
  # present the shots as chat turns with thinking disabled.
  apply_chat_template: true
  fewshot_as_multiturn: true
  enable_thinking: false
  include_path: "full_tests/tasks"

metrics:
  name: exact_match,strict-match
  value: 0.96
